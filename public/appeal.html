<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISE SMP | Ban Appeals</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000000; color: #ffffff; }
        
        .theme-box { 
            background-color: #050505; 
            border: 1px solid #2e1065; 
            box-shadow: 0 0 25px rgba(88, 28, 135, 0.2); 
        }
        
        .theme-btn { 
            background: linear-gradient(135deg, #4c1d95 0%, #9333ea 100%); 
            color: #ffffff; 
            transition: all 0.3s ease; 
            border: 1px solid #a855f7;
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.25);
        }
        .theme-btn:hover { 
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); 
            transform: translateY(-2px); 
            filter: brightness(1.1); 
        }
        
        .theme-input {
            background-color: #000000;
            border: 1px solid #2e1065;
            color: white;
            transition: all 0.3s ease;
        }
        .theme-input:focus {
            border-color: #a855f7;
            outline: none;
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.3);
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen">

    <div class="bg-[#050505] border-b border-[#2e1065] text-center py-2.5 px-4 text-xs md:text-sm font-heading font-bold text-[#c084fc] tracking-wider animate-pulse">
        ⚡ ARISE SMP — A Premium Server Experience ⚡
    </div>

    <nav class="bg-[#000000]/90 backdrop-blur-md border-b border-[#2e1065] sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3">
                <img src="./logo.png" alt="Logo" class="h-10 w-10 object-contain" onerror="this.style.display='none'">
                <span class="font-heading text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-[#c084fc] to-[#e879f9]">ARISE SMP</span>
            </a>
            <div class="hidden md:flex space-x-6 font-heading text-lg tracking-wide text-gray-400 items-center">
                <a href="/" class="hover:text-[#c084fc] transition">Home</a>
                <a href="/ranks" class="hover:text-[#c084fc] transition">Store Ranks</a>
                <a href="/console" class="hover:text-[#c084fc] transition">ARISE AI</a>
                <a href="/rules" class="hover:text-[#c084fc] transition">Rules</a>
                <a href="/appeal" class="text-white font-semibold drop-shadow-[0_0_8px_rgba(192,132,252,0.5)]">Ban Appeal</a>
            </div>
            <a href="https://discord.gg/VV3n28DuyN" target="_blank" class="theme-btn px-5 py-2.5 rounded-full font-heading font-bold text-sm">
                💬 Join Discord
            </a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-8 py-16">
        <div class="text-center mb-10">
            <h1 class="font-heading text-4xl md:text-5xl font-extrabold uppercase mb-2 text-white">Ban <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#9333ea] to-[#d8b4fe] drop-shadow-[0_0_15px_rgba(147,51,234,0.4)]">Appeal Portal</span></h1>
            <p class="text-gray-400 text-sm">Submit your ban review request. Telemetry and IPs are tracked securely.</p>
        </div>

        <div class="theme-box rounded-2xl p-8">
            <form id="appeal-form" onsubmit="submitAppeal(event)" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Minecraft Username (IGN)</label>
                        <input type="text" id="ign" required class="theme-input w-full rounded-xl px-4 py-3 text-sm" placeholder="e.g. YourIGN">
                    </div>
                    <div>
                        <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Email Address</label>
                        <input type="email" id="email" required class="theme-input w-full rounded-xl px-4 py-3 text-sm" placeholder="you@example.com">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Region / Country</label>
                        <input type="text" id="region" required class="theme-input w-full rounded-xl px-4 py-3 text-sm" placeholder="e.g. North America / India">
                    </div>
                    <div>
                        <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Ban Date</label>
                        <input type="date" id="banDate" class="theme-input w-full rounded-xl px-4 py-3 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Banning Staff Member</label>
                    <input type="text" id="staff" class="theme-input w-full rounded-xl px-4 py-3 text-sm" placeholder="Staff IGN or Console">
                </div>

                <div>
                    <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Reason Banned</label>
                    <input type="text" id="reason" required class="theme-input w-full rounded-xl px-4 py-3 text-sm" placeholder="e.g. Unfair advantage / Anti-cheat flag">
                </div>

                <div>
                    <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Appeal Statement / Explanation</label>
                    <textarea id="statement" rows="4" required class="theme-input w-full rounded-xl px-4 py-3 text-sm resize-none" placeholder="Explain why your ban should be lifted..."></textarea>
                </div>

                <button type="submit" id="submit-btn" class="theme-btn w-full py-4 rounded-xl font-heading font-bold text-lg tracking-wide">
                    Submit Appeal Ticket
                </button>
            </form>
            <div id="response-msg" class="mt-4 text-center text-sm font-mono"></div>
        </div>
    </main>

    <script>
        async function submitAppeal(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('response-msg');
            btn.disabled = true;
            btn.innerText = "Transmitting securely...";
            msg.innerText = "";

            const payload = {
                ign: document.getElementById('ign').value,
                email: document.getElementById('email').value,
                region: document.getElementById('region').value,
                banDate: document.getElementById('banDate').value,
                staff: document.getElementById('staff').value,
                reason: document.getElementById('reason').value,
                statement: document.getElementById('statement').value
            };

            try {
                const response = await fetch('/api/appeal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    msg.className = "mt-4 text-center text-sm font-mono text-emerald-400";
                    msg.innerText = "✅ Success! Your ban appeal has been dispatched to staff.";
                    document.getElementById('appeal-form').reset();
                } else {
                    throw new Error(data.error || 'Submission failed');
                }
            } catch (err) {
                msg.className = "mt-4 text-center text-sm font-mono text-red-400";
                msg.innerText = `❌ Error: ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Submit Appeal Ticket";
            }
        }
    </script>
</body>
</html>
