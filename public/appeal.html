<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISE SMP | Ban Appeals</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030005; color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        h1, h2, h3, .font-heading { font-family: 'Rajdhani', sans-serif; }
        
        .aura-border { border: 1px solid rgba(147, 51, 234, 0.3); box-shadow: 0 0 15px rgba(88, 28, 135, 0.2); }
        .nav-item { transition: all 0.3s ease; }
        .nav-item:hover { background: linear-gradient(90deg, rgba(147, 51, 234, 0.2) 0%, transparent 100%); border-left: 4px solid #a855f7; color: #d8b4fe; text-shadow: 0 0 8px rgba(168, 85, 247, 0.8); }
        
        .theme-input { background-color: #0a0a0a; border: 1px solid #2e1065; color: white; transition: all 0.3s ease; }
        .theme-input:focus { border-color: #a855f7; outline: none; box-shadow: 0 0 15px rgba(147, 51, 234, 0.3); }
        
        .action-btn { background: linear-gradient(135deg, #4c1d95 0%, #7e22ce 100%); border: 1px solid #9333ea; transition: all 0.3s ease; }
        .action-btn:hover { box-shadow: 0 0 25px rgba(168, 85, 247, 0.8); filter: brightness(1.2); }

        .sidebar { transition: transform 0.4s ease-in-out; z-index: 50; }
        @media (max-width: 768px) { .sidebar-hidden { transform: translateX(-100%); } }
    </style>
</head>
<body class="flex">

    <!-- Mobile Nav Toggle -->
    <button onclick="toggleSidebar()" class="md:hidden fixed top-4 right-4 z-[60] bg-[#0a0a0a] border border-purple-600 text-white p-3 rounded-lg shadow-[0_0_15px_rgba(147,51,234,0.4)]">
        <i class="fas fa-bars text-xl"></i>
    </button>

    <!-- Side Navigation -->
    <aside id="sidebar" class="sidebar sidebar-hidden md:transform-none fixed top-0 left-0 w-64 h-screen bg-[#050505] border-r border-[#2e1065] flex flex-col shadow-[10px_0_30px_rgba(0,0,0,0.8)]">
        <div class="p-8 text-center border-b border-[#2e1065]">
            <img src="./logo.png" alt="ARISE Logo" class="w-24 h-24 mx-auto mb-3 object-contain drop-shadow-[0_0_15px_rgba(147,51,234,0.5)]" onerror="this.style.display='none'">
            <h2 class="font-heading text-3xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-[#c084fc] to-[#e879f9]">ARISE</h2>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="/" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg"><i class="fas fa-home w-5 text-center text-[#c084fc]"></i><span class="font-semibold tracking-wide">Home</span></a>
            <a href="/ranks" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg"><i class="fas fa-shopping-cart w-5 text-center text-[#c084fc]"></i><span class="font-semibold tracking-wide">Rank Store</span></a>
            <a href="/console" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg"><i class="fas fa-robot w-5 text-center text-[#c084fc]"></i><span class="font-semibold tracking-wide">Ask AI</span></a>
            <a href="/rules" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg"><i class="fas fa-book w-5 text-center text-[#c084fc]"></i><span class="font-semibold tracking-wide">Rules</span></a>
            <a href="/appeal" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg bg-[#110524] border-l-4 border-purple-500"><i class="fas fa-gavel w-5 text-center text-[#c084fc]"></i><span class="font-semibold tracking-wide">Ban Appeal</span></a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 md:ml-64 min-h-screen p-6 md:p-12 relative z-10">
        <div class="max-w-3xl mx-auto mt-8">
            <div class="text-center mb-10">
                <h1 class="text-4xl md:text-5xl font-extrabold uppercase mb-2">Ban <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#a855f7] to-[#d8b4fe]">Appeal Portal</span></h1>
                <p class="text-gray-400 text-sm">Submit your ban review request. Telemetry and IPs are tracked securely.</p>
            </div>

            <div class="bg-[#050505] aura-border rounded-2xl p-8">
                <form id="appeal-form" onsubmit="submitAppeal(event)" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Minecraft Username (IGN)</label>
                            <input type="text" id="ign" required class="theme-input w-full rounded-xl px-4 py-3 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Email Address</label>
                            <input type="email" id="email" required class="theme-input w-full rounded-xl px-4 py-3 text-sm">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Region / Country</label>
                            <input type="text" id="region" required class="theme-input w-full rounded-xl px-4 py-3 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Ban Date</label>
                            <input type="date" id="banDate" class="theme-input w-full rounded-xl px-4 py-3 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Banning Staff Member</label>
                        <input type="text" id="staff" class="theme-input w-full rounded-xl px-4 py-3 text-sm" placeholder="Staff IGN or Console">
                    </div>
                    <div>
                        <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Reason Banned</label>
                        <input type="text" id="reason" required class="theme-input w-full rounded-xl px-4 py-3 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-heading uppercase tracking-wider text-gray-400 mb-2">Appeal Statement</label>
                        <textarea id="statement" rows="4" required class="theme-input w-full rounded-xl px-4 py-3 text-sm resize-none" placeholder="Explain why your ban should be lifted..."></textarea>
                    </div>
                    <button type="submit" id="submit-btn" class="action-btn w-full py-4 rounded-xl font-heading font-bold text-lg tracking-wide uppercase">
                        Submit Appeal Ticket
                    </button>
                </form>
                <div id="response-msg" class="mt-6 text-center text-sm font-mono"></div>
            </div>
        </div>
    </main>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('sidebar-hidden'); }
        
        let cachedIPv4 = "Detecting...";
        let cachedIPv6 = "Detecting...";

        window.addEventListener('DOMContentLoaded', () => {
            fetch('https://api.ipify.org?format=json').then(res => res.json()).then(data => { cachedIPv4 = data.ip; }).catch(() => { cachedIPv4 = 'Unavailable'; });
            fetch('https://api6.ipify.org?format=json').then(res => res.json()).then(data => { cachedIPv6 = (data.ip && data.ip.includes(':')) ? data.ip : 'IPv4 Only'; }).catch(() => { cachedIPv6 = 'Unavailable'; });
        });

        async function submitAppeal(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('response-msg');
            btn.disabled = true;
            btn.innerText = "Transmitting securely...";
            msg.innerHTML = "";
            msg.className = "mt-6 text-center text-sm font-mono text-gray-400";

            const payload = {
                ign: document.getElementById('ign').value,
                email: document.getElementById('email').value,
                region: document.getElementById('region').value,
                banDate: document.getElementById('banDate').value,
                staff: document.getElementById('staff').value,
                reason: document.getElementById('reason').value,
                statement: document.getElementById('statement').value,
                ipv4: cachedIPv4,
                ipv6: cachedIPv6
            };

            try {
                const response = await fetch('https://ariseback.onrender.com/api/appeal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    msg.className = "mt-6 p-5 bg-green-900/20 border border-green-500/50 rounded-xl text-center text-sm font-mono";
                    msg.innerHTML = `
                        <p class="text-green-400 font-bold mb-2 text-lg">✅ Appeal Successfully Dispatched!</p>
                        <p class="text-gray-300">Your details have been securely sent to our staff team.</p>
                        <hr class="border-green-800/50 my-3">
                        <p class="text-white">⚠️ <strong>CRITICAL NEXT STEP:</strong> You must <a href="https://discord.gg/VV3n28DuyN" target="_blank" class="text-purple-400 underline hover:text-purple-300">open a ticket on our Discord server</a> right now to notify staff that you submitted an appeal.</p>
                    `;
                    document.getElementById('appeal-form').reset();
                } else {
                    throw new Error(data.error || 'Submission failed');
                }
            } catch (err) {
                msg.className = "mt-6 p-4 bg-red-900/20 border border-red-500/50 rounded-xl text-center text-sm font-mono text-red-400";
                msg.innerText = `❌ Error: ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "SUBMIT APPEAL TICKET";
            }
        }
    </script>
</body>
</html>
