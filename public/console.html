<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISE SMP | Ask AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030005; color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; height: 100vh; }
        h1, h2, h3, .font-heading { font-family: 'Rajdhani', sans-serif; }
        .aura-border { border: 1px solid rgba(147, 51, 234, 0.4); box-shadow: 0 0 20px rgba(147, 51, 234, 0.25); }
        .nav-item { transition: all 0.3s ease; }
        .nav-item:hover { background: linear-gradient(90deg, rgba(147, 51, 234, 0.2) 0%, transparent 100%); border-left: 4px solid #a855f7; color: #d8b4fe; }
        .sidebar { transition: transform 0.4s ease-in-out; z-index: 50; }
        @media (max-width: 768px) { .sidebar-hidden { transform: translateX(-100%); } }
        .chat-container { height: calc(100vh - 280px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: #9333ea #050505; }
        .msg-ai { background: linear-gradient(135deg, #110524 0%, #1a0b2e 100%); border: 1px solid #4c1d95; color: #e5e7eb; border-radius: 12px 12px 12px 0; }
        .msg-user { background: #0a0a0a; border: 1px solid #2e1065; color: #d1d5db; border-radius: 12px 12px 0 12px; }
        .chat-input { background: #050505; border: 1px solid #4c1d95; color: white; transition: all 0.3s ease; }
        .chat-input:focus { outline: none; border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
        .send-btn { background: linear-gradient(135deg, #4c1d95 0%, #7e22ce 100%); transition: all 0.3s ease; }
        .send-btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(168, 85, 247, 0.6); }
    </style>
</head>
<body class="flex">

    <button onclick="toggleSidebar()" class="md:hidden fixed top-4 right-4 z-[60] bg-[#0a0a0a] border border-purple-600 text-white p-3 rounded-lg"><i class="fas fa-bars text-xl"></i></button>

    <aside id="sidebar" class="sidebar sidebar-hidden md:transform-none fixed top-0 left-0 w-64 h-screen bg-[#050505] border-r border-[#2e1065] flex flex-col shadow-2xl">
        <div class="p-8 text-center border-b border-[#2e1065]">
            <img src="./logo.png" alt="ARISE Logo" class="w-20 h-20 mx-auto mb-2 object-contain drop-shadow-[0_0_15px_rgba(147,51,234,0.5)]" onerror="this.style.display='none'">
            <h2 class="font-heading text-3xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-[#c084fc] to-[#e879f9]">ARISE</h2>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="/" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg"><i class="fas fa-home w-5 text-center text-[#c084fc]"></i><span class="font-semibold">Home</span></a>
            <a href="/ranks" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg"><i class="fas fa-shopping-cart w-5 text-center text-[#c084fc]"></i><span class="font-semibold">Rank Store</span></a>
            <a href="/console" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg bg-[#110524] border-l-4 border-purple-500"><i class="fas fa-robot w-5 text-center text-[#c084fc]"></i><span class="font-semibold">Ask AI</span></a>
            <a href="/rules" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg"><i class="fas fa-book w-5 text-center text-[#c084fc]"></i><span class="font-semibold">Rules</span></a>
            <a href="/appeal" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg"><i class="fas fa-gavel w-5 text-center text-[#c084fc]"></i><span class="font-semibold">Ban Appeal</span></a>
        </nav>
        <div class="p-6 border-t border-[#2e1065] text-center space-x-4">
            <a href="https://discord.gg/VV3n28DuyN" target="_blank" class="text-gray-400 hover:text-[#5865F2] text-xl"><i class="fab fa-discord"></i></a>
            <a href="https://youtube.com/@harshalgamer272-c2n?si=KBJQ8--yi3ZANgOw" target="_blank" class="text-gray-400 hover:text-[#FF0000] text-xl"><i class="fab fa-youtube"></i></a>
        </div>
    </aside>

    <main class="flex-1 md:ml-64 flex flex-col p-6 md:p-8 relative z-10 h-screen">
        <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col">
            <div class="text-center mb-6">
                <h1 class="text-3xl md:text-5xl font-extrabold uppercase mb-2">ARISE <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#a855f7] to-[#d8b4fe]">AI Console</span></h1>
                <p class="text-gray-400 text-sm">Ask our automated assistant anything about rules, ranks, or server mechanics.</p>
            </div>

            <div class="flex-1 bg-[#050505] aura-border rounded-2xl flex flex-col overflow-hidden shadow-2xl">
                <div id="chat-box" class="chat-container p-6 space-y-4">
                    <div class="flex items-start max-w-[85%]">
                        <div class="w-8 h-8 rounded-full bg-purple-900 border border-purple-500 flex items-center justify-center mr-3 flex-shrink-0 shadow-[0_0_10px_#9333ea]">
                            <i class="fas fa-robot text-xs text-white"></i>
                        </div>
                        <div class="msg-ai p-4 text-sm">
                            <p class="font-bold text-purple-300 mb-1 font-heading text-lg">ARISE System</p>
                            Hello, Challenger. I am the ARISE SMP automated system, powered by the Gemini AI Core. How can I assist you with your journey today?
                        </div>
                    </div>
                </div>

                <div class="p-4 border-t border-[#2e1065] bg-[#020004]">
                    <form onsubmit="sendMessage(event)" class="flex items-center space-x-3">
                        <input type="text" id="ai-input" autocomplete="off" placeholder="Type your query here..." class="chat-input flex-1 px-4 py-3 rounded-xl text-sm">
                        <button type="submit" class="send-btn px-6 py-3 rounded-xl text-white font-bold h-full border border-purple-500">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('sidebar-hidden'); }
        
        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('ai-input');
            const msg = input.value.trim();
            if (!msg) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `
                <div class="flex items-start justify-end max-w-[85%] ml-auto mt-4">
                    <div class="msg-user p-4 text-sm shadow-md">
                        <p class="font-bold text-gray-400 mb-1 font-heading text-lg text-right">You</p>
                        ${msg}
                    </div>
                    <div class="w-8 h-8 rounded-full bg-gray-800 border border-gray-600 flex items-center justify-center ml-3 flex-shrink-0">
                        <i class="fas fa-user text-xs text-gray-400"></i>
                    </div>
                </div>
            `;
            input.value = ''; input.disabled = true;
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="flex items-start max-w-[85%] mt-4">
                    <div class="w-8 h-8 rounded-full bg-purple-900 border border-purple-500 flex items-center justify-center mr-3 flex-shrink-0 shadow-[0_0_10px_#9333ea]">
                        <i class="fas fa-robot text-xs text-white animate-pulse"></i>
                    </div>
                    <div class="msg-ai p-4 text-sm">
                        <p class="font-bold text-purple-300 mb-1 font-heading text-lg">ARISE System</p>
                        <span class="animate-pulse text-gray-400">Accessing neural network...</span>
                    </div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('https://ariseback.onrender.com/api/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (response.ok && data.reply) {
                    let formatted = data.reply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                    chatBox.innerHTML += `
                        <div class="flex items-start max-w-[85%] mt-4">
                            <div class="w-8 h-8 rounded-full bg-purple-900 border border-purple-500 flex items-center justify-center mr-3 flex-shrink-0 shadow-[0_0_10px_#9333ea]">
                                <i class="fas fa-robot text-xs text-white"></i>
                            </div>
                            <div class="msg-ai p-4 text-sm">
                                <p class="font-bold text-purple-300 mb-1 font-heading text-lg">ARISE System</p>
                                <div class="leading-relaxed text-gray-200">${formatted}</div>
                            </div>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || "Failed to establish uplink.");
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="flex items-start max-w-[85%] mt-4">
                        <div class="w-8 h-8 rounded-full bg-red-900 border border-red-500 flex items-center justify-center mr-3 flex-shrink-0">
                            <i class="fas fa-exclamation-triangle text-xs text-white"></i>
                        </div>
                        <div class="msg-ai p-4 text-sm border border-red-500/50">
                            <p class="font-bold text-red-400 mb-1 font-heading text-lg">System Error</p>
                            ${err.message}
                        </div>
                    </div>
                `;
            } finally {
                input.disabled = false; input.focus();
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
