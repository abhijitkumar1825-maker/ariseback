<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISE SMP | Ask AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030005; color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; height: 100vh; }
        h1, h2, h3, .font-heading { font-family: 'Rajdhani', sans-serif; }
        .aura-border { border: 1px solid rgba(147, 51, 234, 0.3); box-shadow: 0 0 15px rgba(88, 28, 135, 0.2); }
        .nav-item { transition: all 0.3s ease; }
        .nav-item:hover { background: linear-gradient(90deg, rgba(147, 51, 234, 0.2) 0%, transparent 100%); border-left: 4px solid #a855f7; color: #d8b4fe; text-shadow: 0 0 8px rgba(168, 85, 247, 0.8); }
        .sidebar { transition: transform 0.4s ease-in-out; z-index: 50; }
        @media (max-width: 768px) { .sidebar-hidden { transform: translateX(-100%); } }
        
        /* Chat UI styling */
        .chat-container { height: calc(100vh - 280px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: #9333ea #050505; }
        .msg-ai { background: linear-gradient(135deg, #110524 0%, #1a0b2e 100%); border: 1px solid #4c1d95; color: #e5e7eb; border-radius: 12px 12px 12px 0; }
        .msg-user { background: #0a0a0a; border: 1px solid #2e1065; color: #d1d5db; border-radius: 12px 12px 0 12px; }
        .chat-input { background: #050505; border: 1px solid #4c1d95; color: white; transition: all 0.3s ease; }
        .chat-input:focus { outline: none; border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }
        .send-btn { background: linear-gradient(135deg, #4c1d95 0%, #7e22ce 100%); transition: all 0.3s ease; }
        .send-btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(168, 85, 247, 0.6); }
    </style>
</head>
<body class="flex">

    <button onclick="toggleSidebar()" class="md:hidden fixed top-4 right-4 z-[60] bg-[#0a0a0a] border border-purple-600 text-white p-3 rounded-lg shadow-[0_0_15px_rgba(147,51,234,0.4)]">
        <i class="fas fa-bars text-xl"></i>
    </button>

    <aside id="sidebar" class="sidebar sidebar-hidden md:transform-none fixed top-0 left-0 w-64 h-screen bg-[#050505] border-r border-[#2e1065] flex flex-col shadow-[10px_0_30px_rgba(0,0,0,0.8)]">
        <div class="p-8 text-center border-b border-[#2e1065]">
            <img src="./logo.png" alt="ARISE Logo" class="w-24 h-24 mx-auto mb-3 object-contain drop-shadow-[0_0_15px_rgba(147,51,234,0.5)]" onerror="this.style.display='none'">
            <h2 class="font-heading text-3xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-[#c084fc] to-[#e879f9]">ARISE</h2>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="/" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg"><i class="fas fa-home w-5 text-center text-[#c084fc]"></i><span class="font-semibold tracking-wide">Home</span></a>
            <a href="/ranks" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg"><i class="fas fa-shopping-cart w-5 text-center text-[#c084fc]"></i><span class="font-semibold tracking-wide">Rank Store</span></a>
            <a href="/console" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg bg-[#110524] border-l-4 border-purple-500"><i class="fas fa-robot w-5 text-center text-[#c084fc]"></i><span class="font-semibold tracking-wide">Ask AI</span></a>
            <a href="/rules" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg"><i class="fas fa-book w-5 text-center text-[#c084fc]"></i><span class="font-semibold tracking-wide">Rules</span></a>
            <a href="/appeal" class="nav-item flex items-center space-x-4 px-4 py-3 text-gray-300 rounded-lg"><i class="fas fa-gavel w-5 text-center text-[#c084fc]"></i><span class="font-semibold tracking-wide">Ban Appeal</span></a>
        </nav>
    </aside>

    <main class="flex-1 md:ml-64 flex flex-col p-6 md:p-8 relative z-10 h-screen">
        <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col">
            
            <div class="text-center mb-6">
                <h1 class="text-3xl md:text-5xl font-extrabold uppercase mb-2">ARISE <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#a855f7] to-[#d8b4fe]">AI Console</span></h1>
                <p class="text-gray-400 text-sm">Ask our automated assistant anything about rules, ranks, or server mechanics.</p>
            </div>

            <!-- Chat Interface -->
            <div class="flex-1 bg-[#050505] aura-border rounded-2xl flex flex-col overflow-hidden shadow-[0_0_40px_rgba(0,0,0,0.8)]">
                
                <!-- Message Area -->
                <div id="chat-box" class="chat-container p-6 space-y-4">
                    <!-- AI Welcome Message -->
                    <div class="flex items-start max-w-[85%]">
                        <div class="w-8 h-8 rounded-full bg-purple-900 border border-purple-500 flex items-center justify-center mr-3 flex-shrink-0 shadow-[0_0_10px_#9333ea]">
                            <i class="fas fa-robot text-xs text-white"></i>
                        </div>
                        <div class="msg-ai p-4 text-sm shadow-[0_0_15px_rgba(147,51,234,0.1)]">
                            <p class="font-bold text-purple-300 mb-1 font-heading text-lg">ARISE System</p>
                            Hello, Challenger. I am the ARISE SMP automated system. How can I assist you with your journey today?
                        </div>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="p-4 border-t border-[#2e1065] bg-[#020004]">
                    <form onsubmit="sendMessage(event)" class="flex items-center space-x-3">
                        <input type="text" id="ai-input" autocomplete="off" placeholder="Type your query here..." class="chat-input flex-1 px-4 py-3 rounded-xl text-sm">
                        <button type="submit" class="send-btn px-6 py-3 rounded-xl text-white font-bold h-full border border-purple-500">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('sidebar-hidden'); }
        
        // Simple UI script to show messages (Frontend only placeholder)
        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('ai-input');
            const msg = input.value.trim();
            if (!msg) return;

            const chatBox = document.getElementById('chat-box');

            // Add User Message
            chatBox.innerHTML += `
                <div class="flex items-start justify-end max-w-[85%] ml-auto">
                    <div class="msg-user p-4 text-sm shadow-md">
                        <p class="font-bold text-gray-400 mb-1 font-heading text-lg text-right">You</p>
                        ${msg}
                    </div>
                    <div class="w-8 h-8 rounded-full bg-gray-800 border border-gray-600 flex items-center justify-center ml-3 flex-shrink-0">
                        <i class="fas fa-user text-xs text-gray-400"></i>
                    </div>
                </div>
            `;
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Simulate AI Typing
            setTimeout(() => {
                chatBox.innerHTML += `
                    <div class="flex items-start max-w-[85%]">
                        <div class="w-8 h-8 rounded-full bg-purple-900 border border-purple-500 flex items-center justify-center mr-3 flex-shrink-0 shadow-[0_0_10px_#9333ea]">
                            <i class="fas fa-robot text-xs text-white"></i>
                        </div>
                        <div class="msg-ai p-4 text-sm shadow-[0_0_15px_rgba(147,51,234,0.1)]">
                            <p class="font-bold text-purple-300 mb-1 font-heading text-lg">ARISE System</p>
                            I am currently running in UI-only mode. To connect me to a real AI brain, you can integrate my frontend with the Gemini or OpenAI API in your backend server.js file!
                        </div>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
